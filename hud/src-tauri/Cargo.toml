[package]
name = "sirius-hud"
version = "1.0.0"
description = "Sirius Floating HUD Overlay & System Tray (Tauri v2)"
authors = ["Sirius Systems Architecture"]
edition = "2021"

[lib]
name = "sirius_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-shell = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
